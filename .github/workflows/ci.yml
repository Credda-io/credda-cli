name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  surface-parity:
    # src/args.ts and src/commands.ts are COPIES of the engine CLI's own files.
    # This job proves they are still byte-identical to their originals, which is
    # the only thing that makes the documented command surface trustworthy.
    #
    # Fails rather than skips when MONOREPO_READ_TOKEN is absent, so fork PRs
    # fail here by design: a parity check that silently does not run is worse
    # than none.
    name: surface parity with the engine CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: mirror
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The engine repository. The org rename has landed: `core`'s own
          # remote is git@github.com:Credda-io/core.git. The old
          # `codereefai/core` still resolved via GitHub's transfer redirect,
          # which is exactly why it needed writing out rather than leaving.
          repository: Credda-io/core
          token: ${{ secrets.MONOREPO_READ_TOKEN }}
          path: engine
      - name: Compare each mirrored file to its original, byte for byte
        run: |
          set -euo pipefail
          status=0
          for f in args.ts commands.ts; do
            src="engine/apps/cli/src/$f"
            dst="mirror/src/$f"
            if [ ! -f "$src" ]; then
              echo "::error::$src is missing in the engine checkout. The CLI moved; update this job and the mirror."
              status=1
              continue
            fi
            if cmp -s "$src" "$dst"; then
              echo "ok: $f matches $src"
            else
              echo "::error::mirror/src/$f has drifted from $src"
              diff -u "$src" "$dst" || true
              status=1
            fi
          done
          # The mirror must not quietly gain or lose a mirrored file either.
          expected=$(node -e "const s=require('fs').readFileSync('mirror/src/index.ts','utf8');const m=s.match(/MIRRORED_FILES[^=]*=\s*\[([^\]]*)\]/);console.log(m[1].replace(/['\s]/g,''))")
          if [ "$expected" != "args.ts,commands.ts" ]; then
            echo "::error::MIRRORED_FILES says '$expected'; this job compares args.ts,commands.ts. Update both together."
            status=1
          fi
          exit $status

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # GitHub's own secret scanning and push protection are not enabled on this
      # repo, so the scan runs here instead. The gitleaks container is used
      # directly rather than gitleaks-action, which needs an org licence key.
      - name: Scan the full history for committed secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --redact --no-banner --verbose
