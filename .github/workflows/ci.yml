name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The README's example, RUN rather than shown. It imports from `dist/`,
      # so it also proves the build produced a package whose documented exports
      # are importable -- and it asserts with `node:assert/strict`, so a moved
      # export or a changed exit code exits non-zero here instead of being
      # discovered by a reader. An example that prints and exits 0 regardless
      # is worse than no example, which is why this step follows the build
      # rather than replacing a test.
      - run: npm run example

  surface-parity:
    # src/args.ts and src/commands.ts are COPIES of the engine CLI's own files.
    # This job proves they are still byte-identical to their originals, which is
    # the only thing that makes the documented command surface trustworthy.
    #
    # Fails rather than skips when MONOREPO_READ_TOKEN is absent, so fork PRs
    # fail here by design: a parity check that silently does not run is worse
    # than none.
    name: surface parity with the engine CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: mirror
      # Say WHICH secret is missing, before `checkout` fails with a message that
      # names neither it nor this job.
      #
      # Failing closed here is deliberate -- see the comment on the job. But the
      # failure it produced was `##[error]Input required and not supplied: token`
      # from inside `actions/checkout`, which mentions no secret, no repository
      # and no remedy. This job then failed on EVERY run from 2026-08-31 to
      # 2026-09-06, `main` included, and nobody diagnosed it: the surface it
      # exists to guard drifted for a week with a red tick beside it that
      # everyone had learned to read as noise.
      #
      # A gate that cannot run has to say so in the words of the thing that is
      # missing. Still exit 1 -- this is a clearer failure, not a softer one.
      - name: Check the engine checkout can authenticate
        env:
          MONOREPO_READ_TOKEN: ${{ secrets.MONOREPO_READ_TOKEN }}
        run: |
          if [ -z "${MONOREPO_READ_TOKEN}" ]; then
            echo "::error title=MONOREPO_READ_TOKEN is not set::This job compares src/args.ts and src/commands.ts against Credda-io/core, which is private, so it needs a token with read access to it. Set the repository secret MONOREPO_READ_TOKEN (a fine-grained PAT or app token with Contents: read on Credda-io/core). Until then this gate cannot run, and it fails rather than skipping: a parity check that silently does not run is worse than none. Fork PRs cannot have the secret and are expected to fail here."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The engine repository. The org rename has landed: `core`'s own
          # remote is git@github.com:Credda-io/core.git. The old
          # `codereefai/core` still resolved via GitHub's transfer redirect,
          # which is exactly why it needed writing out rather than leaving.
          repository: Credda-io/core
          token: ${{ secrets.MONOREPO_READ_TOKEN }}
          path: engine
      - name: Compare each mirrored file to its original, byte for byte
        run: |
          set -euo pipefail
          status=0
          for f in args.ts commands.ts; do
            src="engine/apps/cli/src/$f"
            dst="mirror/src/$f"
            if [ ! -f "$src" ]; then
              echo "::error::$src is missing in the engine checkout. The CLI moved; update this job and the mirror."
              status=1
              continue
            fi
            if cmp -s "$src" "$dst"; then
              echo "ok: $f matches $src"
            else
              echo "::error::mirror/src/$f has drifted from $src"
              diff -u "$src" "$dst" || true
              status=1
            fi
          done
          # The mirror must not quietly gain or lose a mirrored file either.
          expected=$(node -e "const s=require('fs').readFileSync('mirror/src/index.ts','utf8');const m=s.match(/MIRRORED_FILES[^=]*=\s*\[([^\]]*)\]/);console.log(m[1].replace(/['\s]/g,''))")
          if [ "$expected" != "args.ts,commands.ts" ]; then
            echo "::error::MIRRORED_FILES says '$expected'; this job compares args.ts,commands.ts. Update both together."
            status=1
          fi
          exit $status

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # GitHub's own secret scanning and push protection are not enabled on this
      # repo, so the scan runs here instead. The gitleaks container is used
      # directly rather than gitleaks-action, which needs an org licence key.
      - name: Scan the full history for committed secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --redact --no-banner --verbose
